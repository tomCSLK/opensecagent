name: CI

on:
  push:
    branches: [main]
    # Pushes that only change documentation need no build.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
  # Weekly run of cargo deny, so new RustSec advisories show up between changes as well.
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: fmt, clippy, tests (Linux)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Install the stable toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: THIRD-PARTY-LICENSES.txt is up to date
        run: python3 -I dev/third-party-licenses.py --check

  windows:
    name: clippy, tests (Windows)
    if: github.event_name != 'schedule'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Install the stable toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  deny:
    name: cargo deny (advisories, licenses, sources, bans)
    runs-on: ubuntu-24.04
    env:
      CARGO_DENY_VERSION: 0.20.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-${{ env.CARGO_DENY_VERSION }}
      - name: Install cargo-deny
        run: |
          if ! cargo deny --version 2>/dev/null | grep -qF "$CARGO_DENY_VERSION"; then
            cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"
          fi
      - run: cargo deny --locked check

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git show -s --format='%an <%ae>' "$commit")"
            if ! git show -s --format=%B "$commit" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::commit $commit has no line 'Signed-off-by: $author' (use git commit -s)"
              missing=1
            fi
          done
          exit "$missing"
